<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User Profile</title>
    <link rel="stylesheet" href="styles(profedit).css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-image">
            <img src="profile.jpg" alt="User Profile Picture">
            <label for="profile-pic-upload" class="upload-button">
                <i class="fas fa-edit"></i> Change Picture
            </label>
            <input type="file" id="profile-pic-upload" style="display: none;">
        </div>
        <div class="profile-details">
            <form action="#" method="POST">
                <div class="detail-box">
                    <h2>Full Name</h2>
                    <input type="text" name="full_name" value="John Doe" required>
                </div>
                <div class="detail-box">
                    <h2>Phone Number</h2>
                    <input type="tel" name="phone_number" value="+91 12345 67890" required>
                </div>
                <div class="detail-box">
                    <h2>Email ID</h2>
                    <input type="email" name="email_id" value="john.doe@example.com" >
                </div>
                <div class="detail-box">
                    <h2>Number of Donations</h2>
                    <input type="number" name="number_of_donations" value="10" readonly >
                </div>
                <div class="detail-box">
                    <h2>Last Donation Date</h2>
                    <input type="date" name="last_donation_date" value="2024-07-01" readonly>
                </div>
                <button type="submit" class="save-button">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </form>
        </div>
    </div>
</body>
</html>
