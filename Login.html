<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Arial, Helvetica, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;}
form {border: 3px solid #f1f1f1; flex-grow: 1; margin: 10px; display: flex; flex-direction: column; justify-content: center;}

input[type=text], input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
  
}

button {
  background-color: #2a06e2;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
}

button:hover {
  opacity: 0.8;
}

.cancelbtn {
  width: auto;
  padding: 10px 18px;
  background-color: #c41104;
}

.imgcontainer {
  text-align: center;
  width: 50%;
}

img.avatar {
  width: 100%;
  height: auto;
}

.container {
  padding: 16px;
}

span.psw {
  float: right;
  padding-top: 16px;
}

/* Change styles for span and cancel button on extra small screens */
@media screen and (max-width: 300px) {
  body { flex-direction: column; }
  .imgcontainer, form { width: 100%; }
  span.psw {
     display: block;
     float: none;
  }
  .cancelbtn {
     width: 100%;
  }
}
</style>
</head>
<body>
<form action="/action_page.php" method="post">
  <h2>Login </h2>
  <p>See your Growth and get Support</p>
  <div class="container">
    <label for="uname"><b>Enter your Phone Number</b></label>
    <input type="text" placeholder="Enter your phone number" name="uname" required>

    <label for="psw"><b>Password</b></label>
    <input type="password" placeholder="Enter Password" name="psw" required>
        
    <button type="submit">Login</button>
    <label>
      <input type="checkbox" checked="checked" name="remember"> Remember me
    </label>
  </div>

  <div class="container" style="background-color:#f1f1f1">
    <button type="button" class="cancelbtn">Cancel</button>
    <span class="psw">Forgot <a href="#">password?</a></span>
  </div>
</form>

<div class="imgcontainer">
  <img src="https://images.unsplash.com/photo-1718070477385-eed35e367ec8?q=80&w=2075&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Avatar" class="avatar">
</div>


</body>
</html>
