<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirement Page</title>
    <link rel="stylesheet" href="styles(reqadm).css">
</head>
<body>
    <header>
        <nav class="top-nav">
            <div class="left">DDRP</div>
            <div class="right">User Name Template</div>
        </nav>
    </header>
    <main>
        <div class="top-section">
            <div class="left">Requirements</div>
            <div class="right">
                <button class="btn">Refresh</button>
                <button class="btn">New Order</button>
            </div>
        </div>
        <div class="filters">
            <div class="left">
                <input type="text" placeholder="Search">
            </div>
            <div class="right">
                <input type="date">
                <select>
                    <option value="">Select Item</option>
                    <!-- Add more options as needed -->
                </select>
                <select>
                    <option value="">Select Category</option>
                    <!-- Add more options as needed -->
                </select>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Category</th>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Location</th>
                    <th>Number</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Table rows will go here -->
            </tbody>
        </table>
    </main>
</body>
</html>
