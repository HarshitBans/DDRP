<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Donation</title>
    <link rel="stylesheet" href="style(sd).css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <nav class="sidebar">
            <ul>
                <li><a href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="#"><i class="fas fa-hand-holding-heart"></i> Donate</a></li>
                <li><a href="#"><i class="fas fa-box"></i> Orders</a></li>
            </ul>
        </nav>
        <div class="main-content">
            <h1>Make Donation</h1>
            <form>
                <div class="form-group">
                    <label for="search-location">Search Location:</label>
                    <div class="input-icon">
                        <input type="text" id="search-location" placeholder="Enter location">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="donation-date">Date:</label>
                    <div class="input-icon">
                        <input type="date" id="donation-date">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First Name:</label>
                        <input type="text" id="first-name" placeholder="First name">
                    </div>
                    <div class="form-group">
                        <label for="middle-name">Middle Name:</label>
                        <input type="text" id="middle-name" placeholder="Middle name">
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" placeholder="Last name">
                    </div>
                </div>
                <div class="form-group">
                    <label for="phone-number">Phone Number:</label>
                    <input type="tel" id="phone-number" placeholder="Enter phone number">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="location">Location:</label>
                        <input type="text" id="location" placeholder="Enter location">
                    </div>
                    <div class="form-group">
                        <label for="time">Time:</label>
                        <input type="time" id="time">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category:</label>
                        <input type="text" id="category" placeholder="Enter category">
                    </div>
                    <div class="form-group">
                        <label for="item">Item:</label>
                        <input type="text" id="item" placeholder="Enter item">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="quantity">Quantity:</label>
                        <input type="number" id="quantity" placeholder="Enter quantity">
                    </div>
                    <div class="form-group">
                        <label for="expiry">Expiry Date:</label>
                        <input type="date" id="expiry">
                    </div>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
