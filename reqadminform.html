<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDRP Form</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="styles(reqadmf).css">
    <script>
        function toggleNav() {
            const nav = document.getElementById('vertical-nav');
            if (nav.style.display === 'block') {
                nav.style.display = 'none';
            } else {
                nav.style.display = 'block';
            }
        }
    </script>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <span class="menu-icon" onclick="toggleNav()">&#9776;</span>
            <img src="logo.jpg" alt="Logo">
            <span>DDRP</span>
        </div>
        <div class="navbar-right">
            <span>User Template</span>
        </div>
    </div>

    <div id="vertical-nav" class="vertical-nav">
        <a href="#dashboard">Dashboard</a>
        <a href="#requirement">Requirement</a>
        <a href="#profile">Profile</a>
    </div>
    <h2>Fill in the Requirements</h2>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label for="serial-number">Serial Number</label>
                <input type="text" id="serial-number" name="serial-number" value="#DO1" readonly style="width:35%">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="Choose category">Choose Category</option>
                        <option value="food">Food</option>
                        <option value="medicine">Medicine</option>
                        <option value="clothes">Clothes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="item">Item</label>
                    <input type="text" id="item" name="item" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" required>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="number">Number</label>
                    <input type="number" id="number" name="number" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="incomplete">Incomplete</option>
                        <option value="complete">Complete</option>
                    </select>
                </div>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
